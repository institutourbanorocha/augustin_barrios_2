<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso de Violão Clássico – Prof. Urbano Rocha</title>
<style>
:root{--bg:#eef7f5;--card:#fff;--tx:#1d2b26;--mut:#5b716a;--ac:#2a7a52;--bd:#cfe3de}
@media (prefers-color-scheme:dark){:root{--bg:#101a17;--card:#17241f;--tx:#e6f2ee;--mut:#98b1a9;--ac:#5fc79a;--bd:#2b423a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Georgia,serif;background:var(--bg);color:var(--tx)}
header{max-width:960px;margin:0 auto;padding:24px 20px 8px}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:8px}.brand img{width:110px;height:110px;border-radius:50%;object-fit:cover}h1{margin:0;font-size:1.7rem;line-height:1.2}h1 small{display:block;font-size:1.1rem;font-weight:400;color:var(--ac);margin-top:4px}h2{margin:18px 0 0;font-size:1.15rem}
p.sub{margin:4px 0 16px;color:var(--mut)}
#q{width:100%;padding:10px 14px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
main{max-width:960px;margin:0 auto;padding:12px 20px 48px;display:grid;gap:10px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 16px}
.n{font:600 .9rem system-ui,sans-serif;color:var(--ac);width:2rem}
.t{flex:1 1 240px}
.t b{display:block}
.t small{color:var(--mut);font-family:system-ui,sans-serif}
.btns{display:flex;gap:8px;flex-wrap:wrap;font:.85rem system-ui,sans-serif}
.btns a{padding:6px 12px;border-radius:6px;border:1px solid var(--ac);color:var(--ac);text-decoration:none}
.btns a.fill{background:var(--ac);color:var(--bg)}
.btns a:hover{opacity:.8}
#empty{display:none;color:var(--mut);text-align:center;padding:20px}
footer{max-width:960px;margin:0 auto;padding:0 20px 32px;color:var(--mut);font:.8rem system-ui,sans-serif}
.hero{position:relative;min-height:340px;display:flex;align-items:flex-end;overflow:hidden;color:#fff}
.hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 46%}
.hero .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,20,16,.85) 0%,rgba(6,20,16,.55) 45%,rgba(6,20,16,.05) 100%),linear-gradient(0deg,rgba(6,20,16,.55),transparent 50%)}
.hero .brand{position:relative;max-width:960px;width:100%;margin:0 auto;padding:28px 20px}
.hero .brand img{border:3px solid rgba(255,255,255,.85);box-shadow:0 4px 18px rgba(0,0,0,.4)}
.hero h1{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5);font-size:2rem}
.hero h1 small{color:#bff0d8}
@media(max-width:600px){.hero{min-height:280px}.hero h1{font-size:1.5rem}.hero .brand img{width:84px;height:84px}}
</style>
</head>
<body>
<section class="hero"><img class="bg" alt="Violonista tocando em uma varanda futurista ao pôr do sol" src="img/hero.jpg"><div class="shade"></div><div class="brand"><img alt="Logo UTI da Música – Urbano Rocha" src="img/logo.jpg"><h1>Curso de Violão Clássico<small>Prof. Urbano Rocha</small></h1></div></section>
<header>
    <h2>Agustín Barrios Mangoré – Music for Guitar, Vol. 2</h2>
  <p class="sub">Revisão de Jesús Benites R. · Zen-On · 25 peças em PDF individual</p>
  <input id="q" type="search" placeholder="Buscar peça…" aria-label="Buscar peça">
</header>
<main id="list"></main>
<div id="empty">Nenhuma peça encontrada.</div>
<footer>“Vídeo” abre a gravação indicada; “Buscar no YouTube” abre a busca pela peça (o resultado pode variar).</footer>

<script>
const D="https://www.dropbox.com/scl/fi/";
// [título, páginas, caminho Dropbox, vídeo direto (opcional)]
const P=[
["Mabelita (Gavota)",1,"in1obztttb1h5efbr6xb9/01-Mabelita-Gavota.pdf?rlkey=x7ccwcqu7uw5efaowpl9v3lwc&st=bi937ijw"],
["Minueto en Do",1,"c07lpto7ehpl4dqqeo90h/02-Minueto-en-Do.pdf?rlkey=ifi54a6t8w6pq56ndvj450x5o&st=zn4frwng"],
["Gavota al Estilo Antiguo",2,"0kke8ug09shcqztacldyh/03-Gavota-al-Estilo-Antiguo.pdf?rlkey=7fxf2yvyh00zvwqsy55a8g4i6&st=uorkla96"],
["Villancico de Navidad",2,"suerab0o84ktetgxpfoun/04-Villancico-de-Navidad.pdf?rlkey=h2vwhrxzmr52g7cawpanyl7md&st=3dgn36fw"],
["Estudio No. 6",2,"oumiwm4iprc41j1gebgtr/05-Estudio-No.-6.pdf?rlkey=ktlltx5royzu548foswc6g9r7&st=va7xni8n"],
["Canción de cuna",2,"yv3z40v29ejp2p08v7oo2/06-Cancion-de-cuna.pdf?rlkey=2xcmjnlstite6wyzsxe0siysk&st=xs14w2kb"],
["Danza",2,"y0gwzlqho0euahuq7q0vg/07-Danza.pdf?rlkey=s9heodtd482ze4qr7d2pxj35y&st=nkzdx26n"],
["Barcarola",2,"2thscwyzhdr7f8xn71r4h/08-Barcarola.pdf?rlkey=w8ksu7b5zpna99jpz1abrihms&st=c0hd3iba"],
["Estudio en Si menor (dos guitarras)",4,"i3lgq871lva4x504a0dys/09-Estudio-en-Si-menor-dos-guitarras.pdf?rlkey=gzcrgzovi1pyebku162q2gauf&st=733np04t"],
["La Samaritana",2,"yyudo2zcvgaum7rr338n0/10-La-Samaritana.pdf?rlkey=bse85pgru3wte9qs1nbpqdfv4&st=ik9g5n6q"],
["Preludio en Mi mayor",1,"bdt745augxtuh3mhpb15m/11-Preludio-en-Mi-mayor.pdf?rlkey=hb35t2m3e19xtk21i0n0k0l0b&st=iwepgiv1"],
["Cueca",3,"t36c1gwspp3pdd0kuynol/12-Cueca.pdf?rlkey=cf7p340gvns1ky2hueewj5zzq&st=flrlvl48"],
["Aire de Zamba",2,"8xc081gey5omfl5zx6gm0/13-Aire-de-Zamba.pdf?rlkey=bhciit1hx3y8n8a6pet32vnqg&st=5218ttjx"],
["Estilo argentino",2,"msspmfy0jz674xk4tzrlx/14-Estilo-argentino.pdf?rlkey=6si2nx0sui96ro8ede9vgeiaq&st=2xtnrsdd"],
["Danza güaraní",1,"1sd8t27c61jq4tcvahnzq/15-Danza-guarani.pdf?rlkey=2df2inrkbgvi3w50wxhpcpfxh&st=vppp3y04"],
["Allegro sinfónico",5,"4gqc8sfbx86weujezasu5/16-Allegro-sinfonico.pdf?rlkey=ykv002fcv2mzhjqkv9ncwvq4s&st=ot80pr3c"],
["País de Abanicos",2,"g2i4m5gd4rtbwvwl6zk9j/17-Pais-de-Abanicos.pdf?rlkey=1mvvvfua33ovv1pmsmlfw6ovo&st=2afck6tp"],
["El Ultimo Trémolo",6,"jolg9wmn49bicfueyr0bu/18-El-Ultimo-Tremolo.pdf?rlkey=8op9kx5sal5p72g6r6tizubud&st=47ixbji6"],
["Leyenda de España",4,"skqvu49bxeixooyoh8axf/19-Leyenda-de-Espana.pdf?rlkey=xsjga5we2f5afloinxnlrb861&st=sl6sp1te"],
["Vals No. 2 (Junto a tu corazón)",4,"i58hhttdycug7ylpfuo5o/20-Vals-No.-2-Junto-a-tu-corazon.pdf?rlkey=qgf70gtgzsso2tu5b59ilsxzs&st=7xyxnkw0"],
["Estudio de Concierto No. 1",4,"pasnggxe636u5dudruu3r/21-Estudio-de-Concierto-No.-1.pdf?rlkey=8g5afgj5mb8zv02irjadxotbh&st=0jjina9y"],
["Contemplación",8,"pu9m9pfoz7jy9h5xw73qp/22-Contemplacion.pdf?rlkey=1mbf3wtuk2l8dj65ofr4j5aj8&st=ztwilg3s"],
["Preludio Op. 5, No. 1",4,"w51zvcy2kdahthkotfg4z/23-Preludio-Op.-5-No.-1.pdf?rlkey=gsio0s0uurm5yf8v6eeen3x89&st=15k67xnc"],
["Vals Op. 8, No. 4",4,"wepexew1cxx1idse1dmfn/24-Vals-Op.-8-No.-4.pdf?rlkey=xr7031ro5a43t6mlr80lmjqxd&st=1f9br9yo"],
["Un Sueño en la Floresta",10,"z2i7e820zf0blze9g9t55/25-Un-Sueno-en-la-Floresta.pdf?rlkey=46g77uy9xrzm8gynpwjjh10hl&st=zqea6f9q","https://www.youtube.com/watch?v=p4FHNIQqOpg"]
];

const list=document.getElementById("list"),empty=document.getElementById("empty");
P.forEach((p,i)=>{
  const [t,pg,path,vid]=p, base=D+path;
  const yt=vid||"https://www.youtube.com/results?search_query="+encodeURIComponent("Barrios Mangoré "+t+" guitarra");
  const el=document.createElement("div");
  el.className="item"; el.dataset.t=t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  el.innerHTML=`<span class="n">${String(i+1).padStart(2,"0")}</span>
  <div class="t"><b>${t}</b><small>${pg} ${pg>1?"páginas":"página"}</small></div>
  <div class="btns">
    <a class="fill" href="${base}&dl=0" target="_blank" rel="noopener">Abrir PDF</a>
    <a href="${base}&dl=1" rel="noopener">Baixar</a>
    <a href="${yt}" target="_blank" rel="noopener">${vid?"▶ Vídeo":"▶ Buscar no YouTube"}</a>
  </div>`;
  list.appendChild(el);
});
document.getElementById("q").addEventListener("input",e=>{
  const v=e.target.value.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  let n=0;
  list.querySelectorAll(".item").forEach(el=>{const m=el.dataset.t.includes(v);el.style.display=m?"":"none";if(m)n++});
  empty.style.display=n?"none":"block";
});
</script>
</body>
</html>
