<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curso de Violão Clássico – Prof. Urbano Rocha</title>
<style>
:root{--bg:#eef7f5;--card:#fff;--tx:#1d2b26;--mut:#5b716a;--ac:#2a7a52;--bd:#cfe3de}
@media (prefers-color-scheme:dark){:root{--bg:#101a17;--card:#17241f;--tx:#e6f2ee;--mut:#98b1a9;--ac:#5fc79a;--bd:#2b423a}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 Georgia,serif;background:var(--bg);color:var(--tx)}
header{max-width:960px;margin:0 auto;padding:32px 20px 8px}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:8px}.brand img{width:110px;height:110px;border-radius:50%;object-fit:cover}h1{margin:0;font-size:1.7rem;line-height:1.2}h1 small{display:block;font-size:1.1rem;font-weight:400;color:var(--ac);margin-top:4px}h2{margin:18px 0 0;font-size:1.15rem}
p.sub{margin:4px 0 16px;color:var(--mut)}
#q{width:100%;padding:10px 14px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
main{max-width:960px;margin:0 auto;padding:12px 20px 48px;display:grid;gap:10px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 16px}
.n{font:600 .9rem system-ui,sans-serif;color:var(--ac);width:2rem}
.t{flex:1 1 240px}
.t b{display:block}
.t small{color:var(--mut);font-family:system-ui,sans-serif}
.btns{display:flex;gap:8px;flex-wrap:wrap;font:.85rem system-ui,sans-serif}
.btns a{padding:6px 12px;border-radius:6px;border:1px solid var(--ac);color:var(--ac);text-decoration:none}
.btns a.fill{background:var(--ac);color:var(--bg)}
.btns a:hover{opacity:.8}
#empty{display:none;color:var(--mut);text-align:center;padding:20px}
footer{max-width:960px;margin:0 auto;padding:0 20px 32px;color:var(--mut);font:.8rem system-ui,sans-serif}
</style>
</head>
